    <text x="110" y="380" font-size="16" fill="#737373"><tspan x="110" dy="0">【卡片一说明】统一入口检索，</tspan><tspan x="110" dy="28">结果按更新时间排序，</tspan><tspan x="110" dy="28">无需再向同事询问。</tspan></text>
    <rect x="463" y="190" width="353" height="400" fill="#F0F0EE"/>
    <rect x="463" y="190" width="353" height="6" fill="#002FA7"/>
    <text x="493" y="270" font-size="28" font-weight="700" fill="#002FA7">02</text>
    <text x="493" y="325" font-size="22" font-weight="700" fill="#0A0A0A">【卡片二标题】控制范围</text>
    <text x="493" y="380" font-size="16" fill="#737373"><tspan x="493" dy="0">【卡片二说明】按项目与角色授权，</tspan><tspan x="493" dy="28">敏感资料默认不可见，</tspan><tspan x="493" dy="28">共享与安全不再对立。</tspan></text>
