<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <g id="page-bg" data-pptx-bounds="0 0 1280 720">
    <rect width="1280" height="720" fill="#0A0A0A"/>
  </g>
  <g id="decision-title" data-pptx-bounds="120 90 1040 150">
    <text x="120" y="170" font-size="40" font-weight="700" fill="#FFFFFF">【页面标题】请求批准一期立项与预算</text>
    <rect x="120" y="200" width="120" height="6" fill="#002FA7"/>
  </g>
  <g id="decision-items" data-pptx-bounds="120 280 1040 300">
