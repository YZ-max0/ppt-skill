<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
     data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <g id="page-bg" data-pptx-bounds="0 0 1280 720">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="page-title" data-pptx-bounds="80 40 1120 100">
    <text x="80" y="90" font-size="40" font-weight="700" fill="#0A0A0A">【页面标题】统一检索让最新版本一击可中</text>
    <rect x="80" y="112" width="80" height="4" fill="#002FA7"/>
  </g>
  <g id="step-flow" data-pptx-bounds="80 200 1120 230">
    <rect x="80" y="300" width="1120" height="6" fill="#E2E8F0"/>
    <circle cx="200" cy="303" r="18" fill="#002FA7"/>
    <text x="184" y="311" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
    <circle cx="530" cy="303" r="18" fill="#002FA7"/>
    <text x="514" y="311" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
    <circle cx="860" cy="303" r="18" fill="#002FA7"/>
    <text x="844" y="311" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <circle cx="1020" cy="303" r="18" fill="#E2E8F0"/>
    <text x="1004" y="311" font-size="18" font-weight="700" fill="#737373">4</text>
    <text x="150" y="380" font-size="20" font-weight="600" fill="#0A0A0A">【步骤一标题】输入关键词</text>
    <text x="150" y="412" font-size="16" fill="#737373">【步骤一说明】支持按标题与正文检索</text>
    <text x="480" y="380" font-size="20" font-weight="600" fill="#0A0A0A">【步骤二标题】权限内筛选</text>
    <text x="480" y="412" font-size="16" fill="#737373">【步骤二说明】仅返回有权查看的资料</text>
    <text x="810" y="380" font-size="20" font-weight="600" fill="#0A0A0A">【步骤三标题】按时间排序</text>
    <text x="810" y="412" font-size="16" fill="#737373">【步骤三说明】最新版本优先呈现</text>
    <text x="940" y="380" font-size="20" font-weight="600" fill="#0A0A0A">【步骤四标题】直达原文</text>
    <text x="940" y="412" font-size="16" fill="#737373">【步骤四说明】点击直达原文</text>
  </g>
  <g id="step-note" data-pptx-bounds="80 490 1120 140">
    <rect x="80" y="490" width="1120" height="140" fill="#F0F0EE"/>
    <text x="120" y="545" font-size="20" font-weight="600" fill="#0A0A0A">【边界标题】一期范围说明</text>
    <text x="120" y="588" font-size="18" fill="#737373"><tspan x="120" dy="0">【边界正文】一期只做关键词检索，不做语义理解与智能问答，</tspan><tspan x="120" dy="28">先把找得到做到确定，再谈找得准。</tspan></text>
  </g>
</svg>
